<div class="bg-linear-to-br from-green-600 via-green-500 to-green-400 text-white mb-8">
    <div class="container mx-auto px-4 py-12 sm:py-16">
        <nav class="flex items-center gap-2 text-sm text-white/70 mb-6">
            <a class="hover:text-white transition-colors" routerLink="/">Home</a>
            <span class="text-white/40">/</span>
            <span class="text-white font-medium">Categories</span>
        </nav>

        <div class="flex items-center gap-5">
            <div
                class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center shadow-xl ring-1 ring-white/30">
                <i class="fa-solid fa-tags text-3xl"></i>
            </div>

            <div>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">All Categories</h1>
                <p class="text-white/80 mt-1">Shop from your favorite categories</p>
            </div>
        </div>
    </div>
</div>
<div class="container  px-4 pb-10">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        @for (item of subCategoriesList() | paginate: { 
            id: 'subs_pagination',
            itemsPerPage: pageSize(), 
            currentPage: currentPage(), 
            totalItems: totalItems() 
        }; track item._id) {
            
            <a [routerLink]="['/subcategories', item._id]" 
   class="group bg-white rounded-2xl border border-gray-100 p-4 sm:p-6 shadow-sm hover:shadow-xl hover:border-green-200 transition-all duration-300 hover:-translate-y-1">
    
    <div class="aspect-square rounded-xl overflow-hidden bg-gray-50 mb-4">
        <img [src]="item.image" 
             [alt]="item.name" 
             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
    </div>

    <h3 class="font-bold text-gray-900 text-center group-hover:text-green-600 transition-colors">
        {{ item.name }}
    </h3>

    <div class="flex justify-center mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
        <span class="text-xs text-green-600 flex items-center gap-1 font-medium">
            View Subcategories
            <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </span>
    </div>
</a>
        }
    </div>

    <div class="flex justify-center mt-12">
        <pagination-controls 
            id="subs_pagination"
            (pageChange)="pageChanged($event)"
            previousLabel="Prev"
            nextLabel="Next"
            screenReaderPaginationLabel="Pagination"
            screenReaderPageLabel="page"
            class="custom-pagination">
        </pagination-controls>
    </div>
</div>
<app-our-services></app-our-services>
