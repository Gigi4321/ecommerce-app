<div class="bg-linear-to-br from-green-600 via-green-500 to-green-400 text-white mb-8">
    <div class="container mx-auto px-4 py-12 sm:py-16">
        <nav class="flex items-center gap-2 text-sm text-white/70 mb-6">
            <a class="hover:text-white transition-colors" routerLink="/">Home</a>
            <span class="text-white/40">/</span>
            <span class="text-white font-medium">Brands</span>
        </nav>

        <div class="flex items-center gap-5">
            <div
                class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center shadow-xl ring-1 ring-white/30">
                <i class="fa-solid fa-tags text-3xl"></i>
            </div>

            <div>
                <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Top Brands</h1>
                <p class="text-white/80 mt-1">Shop from your favorite brands</p>
            </div>
        </div>
    </div>
</div>
<div class="container">
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-5">
    @for (item of brands() | paginate: { 
        id: 'brands_pagination',
        itemsPerPage: pageSize(), 
        currentPage: currentPage(), 
        totalItems: totalItems() 
    }; track item._id) {
        
    <a class="group bg-white rounded-2xl border border-gray-100 p-4 sm:p-5 shadow-sm hover:shadow-xl hover:border-primary/20 transition-all duration-300 hover:-translate-y-1"
       [routerLink]="['/brand-product',item._id]" [queryParams]="{brand: item._id}">
        
        <div class="aspect-square rounded-xl overflow-hidden bg-gray-50 mb-3 p-4 flex items-center justify-center">
            <img [alt]="item.name"
                 class="w-full h-full object-contain group-hover:scale-110 transition-transform duration-500"
                 [src]="item.image">
        </div>

        <h3 class="font-semibold text-gray-900 text-center text-sm group-hover:text-primary transition-colors truncate">
            {{item.name}}
        </h3>

        <div class="flex justify-center mt-1.5 opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="text-xs text-primary flex items-center gap-1 font-medium">
                View Products
                <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </span>
        </div>
    </a>
    }
  </div>

  <div class="flex justify-center mt-10">
    <pagination-controls 
    class="custom-pagination"
      id="brands_pagination"
      (pageChange)="pageChanged($event)"
      previousLabel="Previous"
      nextLabel="next">
    </pagination-controls>
  </div>
</div>
<app-our-services></app-our-services>
